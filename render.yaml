services:
  - type: web
    name: orzu-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: BOT_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: UNSPLASH_API_KEY
        sync: false
      - key: ADMIN_ID
        sync: false
